name: Test, Build and Deploy THE BUTTON

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct verified gameplay source
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/main.gd.part* > scripts/main.gd
          echo "32b892ce77ecca2c544dbf2ab8f02e0eedcceb1b4c2d3a126a7572980ae866d5  scripts/main.gd" | sha256sum -c -

      - name: Cache Godot editor
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/.cache/the-button/godot
          key: godot-4.7.2-linux-x86-64

      - name: Install Godot 4.7.2
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/the-button/godot"
          curl -L --fail --retry 4 --retry-all-errors \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$HOME/.cache/the-button/godot"
          chmod +x "$HOME/.cache/the-button/godot/Godot_v4.7.2-stable_linux.x86_64"

      - name: Ensure Godot executable
        shell: bash
        run: chmod +x "$HOME/.cache/the-button/godot/Godot_v4.7.2-stable_linux.x86_64"

      - name: Cache web export templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-4.7.2-export-templates

      - name: Install web export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable" "$RUNNER_TEMP/templates"
          curl -L --fail --retry 4 --retry-all-errors \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz \
            -o "$RUNNER_TEMP/templates.tpz"
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  $RUNNER_TEMP/templates.tpz" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp -a "$RUNNER_TEMP/templates/templates/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Parse, boot and self-test
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$HOME/.cache/the-button/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path . --editor --quit 2>&1 | tee "$RUNNER_TEMP/editor.log"
          ! grep -E 'SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/editor.log"
          "$GODOT" --headless --path . --quit-after 2 2>&1 | tee "$RUNNER_TEMP/boot.log"
          ! grep -E 'SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/boot.log"
          "$GODOT" --headless --path . --script res://tests/self_test.gd 2>&1 | tee "$RUNNER_TEMP/selftest.log"
          grep -q 'SELFTEST_RESULT=PASS' "$RUNNER_TEMP/selftest.log"

      - name: Export web build
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$HOME/.cache/the-button/godot/Godot_v4.7.2-stable_linux.x86_64"
          mkdir -p build/web
          "$GODOT" --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html
          test -f build/web/index.wasm
          test -f build/web/index.pck
          touch build/web/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
